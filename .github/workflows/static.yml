name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: Python syntax
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/*.py
      - name: Documentation and repository guards
        run: sh scripts/verify-docs.sh
      - name: Newcomer onboarding smoke test
        run: sh scripts/check-newcomer.sh
      - name: Repository cleanliness guard
        run: python3 scripts/check-repo-clean.py
