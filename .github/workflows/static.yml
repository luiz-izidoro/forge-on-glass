name: CI
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: Repository guard
        run: sh scripts/check-repo-clean.sh
